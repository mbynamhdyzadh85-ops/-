<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #353b91 0%, #171a46 40%, #090b25 100%);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* ستاره‌ها */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.star {
  position: absolute;
  color: white;
  font-size: 10px;
  animation: fall linear infinite;
  opacity: 0.8;
}

@keyframes fall {
  from {
    transform: translateY(-20px) rotate(0deg);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

/* محتوای اصلی */
.container {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 700px;
  margin: auto;
  padding: 80px 0;
  text-align: center;
}

.logo {
  font-size: 42px;
  margin-bottom: 12px;
  text-shadow: 0 0 25px #9ea7ff;
}

.subtitle {
  color: #c8ccff;
  font-size: 15px;
  margin-bottom: 45px;
}

/* کارت */
.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 25px;
  padding: 20px;
  margin-bottom: 25px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}

.card img,
.card video {
  width: 100%;
  border-radius: 18px;
  display: block;
}

.card h2 {
  margin: 18px 0 8px;
  font-size: 22px;
}

.card p {
  color: #c9cbdf;
  line-height: 1.8;
}

/* دکمه */
.button {
  display: inline-block;
  padding: 13px 25px;
  margin-top: 10px;
  border-radius: 30px;
  background: #737cff;
  color: white;
  text-decoration: none;
  box-shadow: 0 0 25px rgba(115,124,255,0.5);
  transition: 0.3s;
}

.button:hover {
  transform: scale(1.05);
  background: #8d95ff;
}

.footer {
  margin-top: 50px;
  color: #777cae;
  font-size: 13px;
}
</style>
</head>
